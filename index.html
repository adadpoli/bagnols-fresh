
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bagnols Fresh</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Bagnols Fresh</h1>
  </header>
  <main>
    <div class="products">
      <div class="product">
        <img src="images/cocacola.jpg" alt="Coca-Cola" />
        <h2>Coca-Cola</h2>
        <p>2 €</p>
        <button onclick="addToCart('Coca-Cola', 2)">Ajouter au panier</button>
      </div>
      <div class="product">
        <img src="images/snickers.jpg" alt="Glace Snickers" />
        <h2>Glace Snickers</h2>
        <p>2 €</p>
        <button onclick="addToCart('Glace Snickers', 2)">Ajouter au panier</button>
      </div>
      <div class="product">
        <img src="images/fanta.jpg" alt="Fanta" />
        <h2>Fanta</h2>
        <p>2 €</p>
        <button onclick="addToCart('Fanta', 2)">Ajouter au panier</button>
      </div>
    </div>
    <div class="cart">
      <h2>Panier</h2>
      <ul id="cart-items"></ul>
      <p>Total : <span id="cart-total">0</span> €</p>
      <div id="paypal-button-container"></div>
    </div>
  </main>
  <script src="script.js"></script>
  <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=EUR"></script>
</body>
</html>
